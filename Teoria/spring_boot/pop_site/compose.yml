services:
  db:
    image: postgres:17
    container_name: popsite-db
    environment:
      POSTGRES_DB: popsite
      POSTGRES_USER: popsite
      POSTGRES_PASSWORD: popsite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popsite -d popsite"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: maven:3.9-eclipse-temurin-17
    container_name: popsite-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_THYMELEAF_PREFIX: file:/app/src/main/resources/templates/
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/src/main/resources/static/
    ports:
      - "8080:8080"
    command: mvn clean spring-boot:run
    volumes:
      - .:/app
      - maven-cache:/root/.m2

volumes:
  pgdata:
  maven-cache: