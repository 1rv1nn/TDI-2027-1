services:
  db:
    image: postgres:17
    container_name: popsite-db
    environment:
      POSTGRES_DB: popsite
      POSTGRES_USER: popsite
      POSTGRES_PASSWORD: popsite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popsite -d popsite"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: popsite-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"

volumes:
  pgdata: