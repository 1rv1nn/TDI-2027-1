<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar canción</title>
  <link rel="stylesheet" th:href="@{/css/estilo1.css}">
</head>
<body class="song-form-page">
  <main class="song-form">
    <h1>Agregar una canción</h1>

    <form th:action="@{/pop}" method="post">
      <label for="artista">Artista</label>
      <select id="artista" name="artista" required>
        <option value="">Selecciona un artista</option>
        <option value="Michael Jackson">Michael Jackson</option>
        <option value="Madonna">Madonna</option>
      </select>

      <label for="titulo">Título de la canción</label>
      <input type="text"
             id="titulo"
             name="titulo"
             placeholder="Escribe el título de la canción"
             required>

      <label for="album">Álbum</label>
      <select id="album" name="album" required>
        <option value="">Selecciona un álbum</option>
        <option value="Dangerous">Dangerous</option>
        <option value="Triller">Triller</option>
        <option value="Bad">Bad</option>
        <option value="Invicible">Invicible</option>
        <option value="OffTheWall">Off the Wall</option>

        <option value="Madonna">Madonna</option>
        <option value="True Blue">True Blue</option>
        <option value="LikeVirgin">Like a Virgin</option>
        <option value="LikePrayer">Like a Prayer</option>
        <option value="Erotica">Erotica</option>
        <option value="ConfessionsFloor">Confessions on a Dance Floor</option>

      </select>

      <button type="submit">Agregar canción</button>
    </form>

    <a class="back-link" th:href="@{/pop}">Volver al inicio</a>
  </main>
</body>
</html>
