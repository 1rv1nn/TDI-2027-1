<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Edad</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 320px;
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }
    input, button {
      padding: 8px;
      font-size: 14px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }
    #resultado {
      margin-top: 20px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Consulta tu Edad</h2>
    <form id="formularioEdad">
      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" required>
      <button type="submit">Calcular</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const form = document.getElementById('formularioEdad');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fecha = document.getElementById('fecha').value;

      try {
        const respuesta = await fetch(`/api/calcular-edad?fechaNacimiento=${fecha}`);
        if (!respuesta.ok) throw new Error('Error al procesar la fecha');
        
        const datos = await respuesta.json();
        resultado.textContent = `Resultado: ${datos.mensaje}`;
      } catch (err) {
        resultado.textContent = 'Hubo un error al calcular la edad.';
        resultado.style.color = '#dc3545';
      }
    });
  </script>

</body>
</html>
